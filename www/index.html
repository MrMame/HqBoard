<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>HeroQuest Map Editor</title>
        <script defer type="module" src="./scripts/main.js"></script>
        <link rel="stylesheet" href="styles/main.css">
    </head>
    <body>

        <div id="menu">
            <button onclick="toggleDescription()">Abenteuerbeschreibung</button>
            <button id="saveBoard" >Speichern</button>
            <input id="loadFile" type="file"  accept=".xml" >
        </div>

        <div id="descriptionPanel">
            <h3>Abenteuerbeschreibung</h3>
            <textarea id="descriptionText"></textarea>
        </div>

        <div id="container">
            <div id="tools"></div>
            <div id="board"></div>
        </div>
    </body>
</html>
