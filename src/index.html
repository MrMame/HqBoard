<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HeroQuest Map Editor</title>

<style>
body {
    font-family: Arial;
    margin: 0;
}

/* MENU */
#menu {
    background: #333;
    color: white;
    padding: 10px;
}

#menu button {
    padding: 5px 10px;
}

/* LAYOUT */
#container {
    display: flex;
    gap: 20px;
    padding: 10px;
}

/* TOOLBOX */
#tools {
    width: 180px;
    border: 2px solid #333;
    padding: 10px;
}

.tool-item {
    padding: 6px;
    margin: 4px 0;
    background: #ccc;
    cursor: grab;
    text-align: center;
}

.marker-tool {
    border-radius: 50%;
    background: gold;
    font-weight: bold;
}

/* BOARD */
#board {
    display: grid;
    grid-template-columns: repeat(26, 28px);
    grid-template-rows: repeat(19, 28px);
    gap: 1px;
    background: black;
}

.cell {
    width: 28px;
    height: 28px;
    background: white;
    position: relative;
}

.placed {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: move;
}

.marker {
    border-radius: 50%;
    background: gold;
    font-weight: bold;
}

/* DESCRIPTION PANEL */
#descriptionPanel {
    display: none;
    padding: 10px;
    background: #f4f4f4;
    border-bottom: 2px solid #333;
}

textarea {
    width: 100%;
    height: 100px;
}
</style>
</head>

<body>

<div id="menu">
    <button onclick="toggleDescription()">Abenteuerbeschreibung</button>
    <button onclick="saveXML()">Speichern</button>
    <input type="file" id="loadFile" accept=".xml">
</div>

<div id="descriptionPanel">
    <h3>Abenteuerbeschreibung</h3>
    <textarea id="descriptionText"></textarea>
</div>

<div id="container">
    <div id="tools">
        <h3>Tools</h3>

        <div class="tool-item" draggable="true" data-type="sofa">Sofa</div>
        <div class="tool-item" draggable="true" data-type="tisch">Tisch</div>
        <div class="tool-item" draggable="true" data-type="gegner">Gegner</div>

        <hr>
        <h4>Marker</h4>
        <div id="markerTools"></div>
    </div>

    <div id="board"></div>
</div>

<script>
const board = document.getElementById("board");
const markerTools = document.getElementById("markerTools");
const loadFile = document.getElementById("loadFile");
const descriptionText = document.getElementById("descriptionText");

let draggedType = null;
let draggedLetter = null;
let draggedElement = null;

/* DESCRIPTION TOGGLE */
function toggleDescription() {
    const panel = document.getElementById("descriptionPanel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
}

/* GRID */
for (let y = 0; y < 19; y++) {
    for (let x = 0; x < 26; x++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.x = x;
        cell.dataset.y = y;

        cell.addEventListener("dragover", e => e.preventDefault());

        cell.addEventListener("drop", function(e) {
            e.preventDefault();

            if (draggedElement) {
                this.appendChild(draggedElement);
                draggedElement = null;
                return;
            }

            if (!draggedType) return;

            if (draggedType === "marker") {
                const el = createMarker(draggedLetter);
                this.appendChild(el);
            } else {
                const el = createPlaced(draggedType);
                this.appendChild(el);
            }
        });

        board.appendChild(cell);
    }
}

/* MARKER A-Z ERSTELLEN */
for (let i = 65; i <= 90; i++) {
    const letter = String.fromCharCode(i);
    const div = document.createElement("div");
    div.className = "tool-item marker-tool";
    div.textContent = letter;
    div.draggable = true;
    div.dataset.type = "marker";
    div.dataset.letter = letter;

    div.addEventListener("dragstart", function() {
        draggedType = "marker";
        draggedLetter = letter;
    });

    markerTools.appendChild(div);
}

/* TOOL DRAG */
document.querySelectorAll(".tool-item:not(.marker-tool)").forEach(item => {
    item.addEventListener("dragstart", function() {
        draggedType = this.dataset.type;
    });
});

/* NORMAL OBJEKT */
function createPlaced(type) {
    const el = document.createElement("div");
    el.className = "placed";
    el.draggable = true;
    el.dataset.type = type;
    el.textContent = type;
    el.style.background = "#ccc";

    el.addEventListener("dragstart", function() {
        draggedElement = this;
    });

    el.addEventListener("contextmenu", e => {
        e.preventDefault();
        el.remove();
    });

    return el;
}

/* MARKER */
function createMarker(letter, tooltipText = "") {
    const el = document.createElement("div");
    el.className = "placed marker";
    el.draggable = true;
    el.dataset.type = "marker";
    el.dataset.letter = letter;
    el.dataset.tooltip = tooltipText;
    el.textContent = letter;
    el.title = tooltipText;

    el.addEventListener("dragstart", function() {
        draggedElement = this;
    });

    el.addEventListener("dblclick", function() {
        const text = prompt("Tooltip Text bearbeiten:", el.dataset.tooltip || "");
        if (text !== null) {
            el.dataset.tooltip = text;
            el.title = text;
        }
    });

    el.addEventListener("contextmenu", e => {
        e.preventDefault();
        el.remove();
    });

    return el;
}

/* XML SPEICHERN */
function saveXML() {
    let xml = `<level>\n`;

    xml += `  <description><![CDATA[${descriptionText.value}]]></description>\n`;

    document.querySelectorAll(".placed").forEach(el => {
        const cell = el.parentElement;
        const x = cell.dataset.x;
        const y = cell.dataset.y;

        if (el.dataset.type === "marker") {
            xml += `  <object type="marker" letter="${el.dataset.letter}" x="${x}" y="${y}">\n`;
            xml += `    <tooltip><![CDATA[${el.dataset.tooltip || ""}]]></tooltip>\n`;
            xml += `  </object>\n`;
        } else {
            xml += `  <object type="${el.dataset.type}" x="${x}" y="${y}" />\n`;
        }
    });

    xml += `</level>`;

    const blob = new Blob([xml], { type: "text/xml" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "heroquest_level.xml";
    a.click();
}

/* XML LADEN */
loadFile.addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => loadXML(e.target.result);
    reader.readAsText(file);
});

function loadXML(xmlText) {
    document.querySelectorAll(".placed").forEach(el => el.remove());

    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, "text/xml");

    const desc = xml.getElementsByTagName("description")[0];
    descriptionText.value = desc ? desc.textContent : "";

    const objects = xml.getElementsByTagName("object");

    for (let obj of objects) {
        const type = obj.getAttribute("type");
        const x = obj.getAttribute("x");
        const y = obj.getAttribute("y");

        const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
        if (!cell) continue;

        if (type === "marker") {
            const letter = obj.getAttribute("letter");
            const tooltipNode = obj.getElementsByTagName("tooltip")[0];
            const tooltip = tooltipNode ? tooltipNode.textContent : "";
            cell.appendChild(createMarker(letter, tooltip));
        } else {
            cell.appendChild(createPlaced(type));
        }
    }
}
</script>

</body>
</html>
